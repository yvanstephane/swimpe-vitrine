<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Espace membre Swimpe — connexion et création de compte.">
<meta http-equiv="refresh" content="0;url=https://app.swimpe.com/login">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Swimpe">
<meta property="og:title" content="Espace membre — Swimpe">
<meta property="og:description" content="Connecte-toi à ton espace membre Swimpe, ou crée ton compte gratuitement.">
<meta property="og:url" content="https://swimpe.com/espace.html">
<meta name="theme-color" content="#0B2545">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Espace membre — Swimpe</title>
<style>
:root{--encre:#EAF1FB;--sceau:#F28C28;--papier:#0B2545;--muet:#90A2BB;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
     color:var(--encre);background:var(--papier);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:clamp(48px,9vw,96px) 20px;text-align:center}
h1{font-family:Georgia,serif;font-weight:800;font-size:clamp(28px,5vw,42px);line-height:1.15;margin-bottom:16px}
p{color:var(--muet);margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:13px 26px;
  border-radius:4px;font-size:16px;text-decoration:none;font-weight:600;
  background:var(--sceau);color:#2A1705;border:2px solid var(--sceau)}
</style>
</head>
<body>
<main>
  <section class="wrap">
    <h1>Ton espace membre est ouvert</h1>
    <p>On t'emmène vers la page de connexion. Si rien ne se passe, touche le bouton ci-dessous.</p>
    <a class="btn" href="https://app.swimpe.com/login">Se connecter ou créer un compte &rarr;</a>
  </section>
</main>
</body>
</html>
