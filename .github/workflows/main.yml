name: Swimpe — moteur d'offres

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  extraire:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r swimpe_moteur/requirements.txt

      - name: Lancer le moteur
        env:
          # URL et clé publique = en clair (publiques). Seule la clé d'import est un secret GitHub.
          # Tant que le secret SWIMPE_IMPORT_KEY n'existe pas, la clé est vide → le moteur ignore
          # simplement les « sites à suivre » et tourne normalement.
          SWIMPE_USINE_URL: https://nwvcsqqukgygudbjnryk.supabase.co/functions/v1/usine-fiches
          SWIMPE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53dmNzcXF1a2d5Z3VkYmpucnlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyOTAxNDUsImV4cCI6MjEwMTg2NjE0NX0.NRMeYaAkubvk97eRxoSz_2-9p7OdrvIeJG7Juv2VWp8
          SWIMPE_IMPORT_KEY: ${{ secrets.SWIMPE_IMPORT_KEY }}
        run: python3 swimpe_moteur/moteur.py --config swimpe_moteur/sources.json --out offres.json

      - name: Commit si offres.json a changé
        run: |
          if [ -n "$(git status --porcelain offres.json a_valider.json 2>/dev/null)" ]; then
            git config user.name "swimpe-moteur"
            git config user.email "moteur@swimpe.local"
            git add offres.json
            [ -f a_valider.json ] && git add a_valider.json
            git commit -m "moteur: mise a jour des offres ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Aucun changement."
          fi
